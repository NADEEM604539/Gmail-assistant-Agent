[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-publish"
version = "0.1.0"
description = "Executa for the publish Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-publish" = "publish_plugin:main"

[tool.setuptools]
py-modules = ["publish_plugin"]
